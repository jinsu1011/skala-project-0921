[project]
name = "kvcache-multiperspective-eval"
version = "0.1.0"
description = "Multi-perspective evaluation of KV cache optimization techniques (LangGraph multi-agent + Agentic RAG) - SKALA Pangyo 9-1"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faiss-cpu>=1.12",
    "langchain>=1.0",
    "langchain-community>=0.4",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-tavily>=0.2.12",
    "langgraph>=1.2,<1.3",
    "markdown>=3.10.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "pymupdf>=1.26",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.1",
    "tiktoken>=0.14.0",
    "transformers>=4.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
